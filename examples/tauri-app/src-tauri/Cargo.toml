[package]
name = "tauri-plugin-liquid-glass-demo"
version = "0.1.0"
description = "Standalone demo of tauri-plugin-liquid-glass."
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
publish = false

[lib]
name = "tauri_plugin_liquid_glass_demo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", default-features = false, features = [] }

[dependencies]
tauri = { version = "2.10", features = ["macos-private-api"] }
tauri-plugin-liquid-glass = { path = "../../../" }
